packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  # Test-only: apps/api stubs outbound calls with `msw/node`.
  msw: ^2.12.7
  "@types/node": ^24
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vitest: 4.1.9
  vite-plus: 0.3.0
  vaul: ^1.1.2
  "@hono/vite-build": ^1.11.1
  "@hono/vite-dev-server": ^0.26.0
  dotenv: ^17.4.2
  openid-client: ^6.8.4
  jose: ^6.2.3
  awilix: ^13.0.5
  zod: ^4.4.3
  "@hono/zod-validator": ^0.8.0
  axios: ^1.18.0
  "@tanstack/react-query": ^5.101.0
  tailwindcss: ^4.3.1
  "@tailwindcss/vite": ^4.3.1
  loglayer: ^9.3.0
  "@loglayer/transport-pino": ^3.2.0
  "@loglayer/plugin-opentelemetry": ^3.2.0
  pino: ^10.3.1
  pino-pretty: ^13.1.3
  "@opentelemetry/api": ^1.9.1
  "@opentelemetry/sdk-node": ^0.219.0
  "@opentelemetry/sdk-metrics": ^2.8.0
  "@opentelemetry/exporter-trace-otlp-proto": ^0.219.0
  "@opentelemetry/exporter-metrics-otlp-proto": ^0.219.0
  "@opentelemetry/instrumentation-http": ^0.219.0
  "@opentelemetry/instrumentation-undici": ^0.29.0
  "@opentelemetry/instrumentation-pg": ^0.71.0
  "@hono/otel": ^1.1.2
  class-variance-authority: ^0.7.1
  "@radix-ui/react-slot": ^1.3.0
  i18next: ^26.3.6
  react-i18next: ^17.0.9
  "@tanstack/react-table": ^8.21.3
  "@tanstack/react-form": ^1.33.0
  lucide-react: ^1.24.0
  cmdk: ^1.1.1
  recharts: 3.8.0
  radix-ui: ^1.4.3
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  sonner: ^2.0.7
  next-themes: ^0.4.6
  tw-animate-css: ^1.4.0
  shadcn: ^4.13.0
  react-day-picker: ^10.0.2
  date-fns: ^4.4.0
  "@electric-sql/pglite": ^0.5.8
  "@molca/mes": git+ssh://git@github.com/molca-id/mes-shared.git#v0.1.2
  "@tanstack/react-router": ^1.170.18
  "@tanstack/router-plugin": ^1.168.23
  # shadcn/ui runtime: `radix-ui` is the unified package the new-york-v4 registry
  pg-boss: ^10.4.2
  tsx: ^4.23.15
  "@fontsource-variable/geist": ^5.3.0
  "@fontsource-variable/geist-mono": ^5.3.0
  cn: ^0.5.2
  "@base-ui/react": ^1.9.0
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - hono@4.12.26
allowBuilds:
  # Test-only: apps/api stubs outbound calls with `msw/node`. The browser service
  # worker is never used, so its postinstall has nothing to do.
  msw: true
  esbuild: true
  protobufjs: true
